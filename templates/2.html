<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G-CLOUD LOCAL NODE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: 'Courier New', monospace; }
        .card { background-color: #161b22; border: 1px solid #30363d; }
        .progress { height: 25px; background-color: #21262d; }
        .status-badge { font-size: 1.2em; font-weight: bold; }
        .btn-update { background-color: #238636; color: white; border: none; }
        h1 { color: #58a6ff; }
    </style>
</head>
<body class="container py-5">

    <div class="row mb-4">
        <div class="col text-center">
            <h1>📡 G-CLOUD LOCAL NODE</h1>
            <p class="text-muted">Sistema de Ingesta Automatizada</p>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-body text-center">
            <h5 class="card-title text-muted">ESTADO ACTUAL</h5>
            <div id="status-text" class="status-badge mb-3 text-warning">ESPERANDO CONEXIÓN...</div>
            <h3 id="current-action">...</h3>
            
            <div class="progress mt-3">
                <div id="progress-bar" class="progress-bar progress-bar-striped progress-bar-animated bg-success" role="progressbar" style="width: 0%">0%</div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-header border-bottom border-secondary">
            Dispositivos Conocidos
        </div>
        <div class="card-body">
            <table class="table table-dark table-hover">
                <thead>
                    <tr>
                        <th>Serial (ID)</th>
                        <th>Modelo</th>
                        <th>Alias (Nombre)</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="inventory-list">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        function updateStatus() {
            fetch('/api/status')
                .then(r => r.json())
                .then(data => {
                    if(!data.estado_global) return;
                    
                    document.getElementById('status-text').innerText = data.estado_global;
                    document.getElementById('current-action').innerText = data.mensaje;
                    
                    let barra = document.getElementById('progress-bar');
                    barra.style.width = data.progreso_porcentaje + "%";
                    barra.innerText = data.progreso_porcentaje + "%";

                    // Cambiar color según estado
                    if(data.estado_global === 'COPIANDO') document.getElementById('status-text').className = 'status-badge text-primary';
                    if(data.estado_global === 'ERROR') document.getElementById('status-text').className = 'status-badge text-danger';
                    if(data.estado_global === 'FINALIZADO') document.getElementById('status-text').className = 'status-badge text-success';
                });
        }

        function loadInventory() {
            fetch('/api/inventario')
                .then(r => r.json())
                .then(data => {
                    let html = '';
                    for (const [serial, info] of Object.entries(data)) {
                        html += `
                        <tr>
                            <td><small>${serial}</small></td>
                            <td>${info.modelo}</td>
                            <td><input type="text" class="form-control form-control-sm bg-dark text-light" id="alias-${serial}" value="${info.alias}"></td>
                            <td><button onclick="saveAlias('${serial}')" class="btn btn-sm btn-outline-success">Guardar</button></td>
                        </tr>`;
                    }
                    document.getElementById('inventory-list').innerHTML = html;
                });
        }

        function saveAlias(serial) {
            let val = document.getElementById('alias-' + serial).value;
            fetch('/api/inventario', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({serial: serial, alias: val})
            }).then(() => alert('Nombre actualizado ✅'));
        }

        // Actualizar cada segundo
        setInterval(updateStatus, 1000);
        loadInventory();
    </script>
</body>
</html>
